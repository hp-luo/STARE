hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_


data:
  gen_batch_size: ${data.train_batch_size}
  val_max_response_length: ${data.max_response_length}
  min_train_batch_size_ratio: 1.0


reward_model:
  use_format_reward: False
  use_code_reward: False
  train_num_examine: 0
  val_num_examine: 1
  reward_manager: naive
  true_score: 0.5
  overlong_buffer:
    enable: False # We try to avoid forgetting to set enable
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  _target_: recipe.STARE.config.Agent_AlgoConfig
  partial_rollout_max_split: 1
  mask_invalid_json: False
  mask_invalid_answer: False
  break_json_format_error: True
  mask_repeat_response: False
  truncat_repeat_response: False
  mask_positive_samples: False
  json_format_try_n: 1
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit

trainer:
  trainer_name: RayPPOTrainer
  rollout_data_dir: ""
  validation_data_dir: ""
  wandb_proxy: ""
  wandb_key: ""

actor_rollout_ref:
  rollout:
    _target_: recipe.STARE.config.Agent_RolloutConfig
    partial_rollout_max_split: ${algorithm.partial_rollout_max_split}
    tool_calls_no_limit: False
    stop_tokens: [ "<|im_end|>","<|endoftext|>","<｜end▁of▁sentence｜>"]
    LRUCache_server_weight_prompt_length: 4096
    LRUCache_server_weight_prompt_length_enable: False
    LRUCache_server_weight_score: 1
    free_cache_engine_sleep: ${actor_rollout_ref.rollout.free_cache_engine}
    enable_expert_parallel: False
    val_temperature_lists: null
    multi_turn:
      _target_: recipe.STARE.config.Agent_MultiTurnConfig
      val_max_user_turns: ${actor_rollout_ref.rollout.multi_turn.max_user_turns}
      val_max_assistant_turns: ${actor_rollout_ref.rollout.multi_turn.max_assistant_turns}
      format_real: ${actor_rollout_ref.rollout.multi_turn.format}
      function_name: code_interpreter
  actor:
    _target_: recipe.STARE.config.Agent_FSDPActorConfig
    use_teacher_gt_kl_loss: False
    teacher_gt_kl_loss_coef: 0
    use_partial_rollout_old_log_probs: False
    # Use the STARE clipped surrogate with token-level advantage reweighting.
    policy_loss:
      loss_mode: stare
    # Entropy must be computed in the actor forward pass for STARE monitoring.
    calculate_entropy: True
    adaptive_entropy: # adaptive entropy (unused by STARE, kept for compatibility)
      enabled: False
      max_ent_coef: 0.5
      min_ent_coef: 0
      delta_ent_coef: 0.001
      target_entropy: 0
    stare: # STARE: Surprisal-guided Token-level Advantage Reweighting (paper defaults)
      enabled: True
      variant: O1            # O1 (one-sided amplification, default) | C2 (dual-sided)
      top_p_ratio: 0.1       # P%: top-10% high-surprisal tokens per advantage subset
      reweight_w: 1.1        # W > 1: amplify L+ (positive-advantage high-surprisal)
      reweight_m: 0.9        # M < 1: attenuate L- (negative-advantage high-surprisal, C2 only)
      target_entropy: 0.3    # H_tgt: batch-level closed-loop gate threshold
      adaptive: False        # Section 4.4 adaptive schedule; False keeps fixed weights
      alpha: 0.01
      w_max: 1.5
      m_min: 0.5







